name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build signed release
        env:
          QRST_KEYSTORE_B64: ${{ secrets.QRST_KEYSTORE_B64 }}
          QRST_KEYSTORE_PASSWORD: ${{ secrets.QRST_KEYSTORE_PASSWORD }}
        run: |
          echo "$QRST_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export QRST_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="${{ github.run_number }}"
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "qrst-signer-${VERSION_NAME}.apk"
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" qrst-signer-*.apk --title "QRST Signer $GITHUB_REF_NAME" --generate-notes
